name: Render video
on:
  workflow_dispatch:
    inputs:
      ide:
        description: "Ide cerita (kosongkan untuk pakai story.json)"
        required: false
        default: ""
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install edge-tts mutagen
      - name: Bikin naskah dengan Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IDE: ${{ github.event.inputs.ide }}
        run: python scripts/ide_to_story.py
      - run: python scripts/generate.py
      - run: npx remotion render src/index.jsx Main out/video.mp4
      - name: Kirim ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -F chat_id="$TELEGRAM_CHAT_ID" -F supports_streaming=true -F video=@out/video.mp4 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo"
      - name: Kabari kalau gagal
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="Video gagal dibuat. Cek tab Actions di GitHub, atau coba kirim ide lagi."
